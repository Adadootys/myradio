<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MyRadio - Radio Malaysia</title>
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(180deg, #0b1120 0%, #0f172a 100%);
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }
    header {
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 20;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }
    .logo-box {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .logo-icon {
      font-size: 26px;
    }
    .logo-title {
      font-size: 19px;
      font-weight: 800;
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .tagline {
      font-size: 11px;
      color: #94a3b8;
    }
    .search-box {
      padding: 12px 18px 6px;
    }
    .search-input {
      width: 100%;
      padding: 12px 16px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(30, 41, 59, 0.7);
      color: #f8fafc;
      font-size: 14px;
      outline: none;
      transition: all 0.2s ease;
    }
    .search-input:focus {
      border-color: #38bdf8;
      box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.2);
    }
    .category-chips {
      display: flex;
      gap: 8px;
      padding: 6px 18px 12px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .category-chips::-webkit-scrollbar {
      display: none;
    }
    .chip {
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      background: rgba(30, 41, 59, 0.9);
      color: #94a3b8;
      border: 1px solid rgba(255, 255, 255, 0.05);
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }
    .chip.active {
      background: #0284c7;
      color: #ffffff;
      border-color: #38bdf8;
      box-shadow: 0 2px 8px rgba(2, 132, 199, 0.4);
    }

    .station-list {
      flex: 1;
      padding: 6px 18px 130px;
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }
    @media (min-width: 600px) {
      .station-list {
        grid-template-columns: repeat(2, 1fr);
      }
    }
    .station-card {
      background: rgba(30, 41, 59, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 16px;
      padding: 14px;
      display: flex;
      align-items: center;
      gap: 14px;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .station-card:active {
      transform: scale(0.98);
      background: rgba(51, 65, 85, 0.8);
    }
    .station-card.playing {
      border-color: #38bdf8;
      background: rgba(14, 165, 233, 0.15);
      box-shadow: 0 4px 15px rgba(14, 165, 233, 0.15);
    }
    .station-icon {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      background: linear-gradient(135deg, #1e293b, #334155);
      flex-shrink: 0;
      position: relative;
    }
    .station-card.playing .station-icon {
      background: linear-gradient(135deg, #0284c7, #38bdf8);
      animation: pulse 1.8s infinite ease-in-out;
    }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(56, 189, 248, 0.5); }
      50% { box-shadow: 0 0 0 8px rgba(56, 189, 248, 0); }
    }
    .station-info {
      flex: 1;
      min-width: 0;
    }
    .station-name {
      font-size: 15px;
      font-weight: 700;
      color: #f1f5f9;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .station-genre {
      font-size: 12px;
      color: #94a3b8;
      margin-top: 3px;
    }
    .badge-status {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.08);
      color: #cbd5e1;
    }
    .station-card.playing .badge-status {
      background: #0284c7;
      color: white;
    }

    /* Bottom Player */
    .player-dock {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(16px);
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      padding: 12px 18px 20px;
      z-index: 30;
      box-shadow: 0 -8px 25px rgba(0, 0, 0, 0.5);
    }
    .player-progress-bar {
      height: 3px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 2px;
      margin-bottom: 12px;
      overflow: hidden;
      position: relative;
    }
    .player-progress-fill {
      height: 100%;
      width: 0%;
      background: #38bdf8;
      border-radius: 2px;
      transition: width 0.3s;
    }
    .player-progress-fill.active {
      width: 100%;
      animation: indeterminate 2s infinite linear;
      background: linear-gradient(90deg, #0284c7, #38bdf8, #818cf8);
    }
    @keyframes indeterminate {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }
    .player-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .player-track {
      flex: 1;
      min-width: 0;
    }
    .player-track-name {
      font-size: 15px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #f8fafc;
    }
    .player-track-sub {
      font-size: 12px;
      color: #38bdf8;
      margin-top: 2px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .live-dot {
      width: 8px;
      height: 8px;
      background: #ef4444;
      border-radius: 50%;
      display: inline-block;
      animation: blink 1s infinite alternate;
    }
    @keyframes blink {
      0% { opacity: 0.3; }
      100% { opacity: 1; }
    }
    .controls {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .btn-control {
      background: none;
      border: none;
      color: #f1f5f9;
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      transition: 0.15s;
    }
    .btn-control:active {
      background: rgba(255, 255, 255, 0.1);
      transform: scale(0.92);
    }
    .btn-play {
      width: 50px;
      height: 50px;
      font-size: 24px;
      background: linear-gradient(135deg, #0284c7, #38bdf8);
      color: white;
      box-shadow: 0 4px 14px rgba(2, 132, 199, 0.5);
    }

    /* Modal Tambah Stesen */
    .add-station-banner {
      background: rgba(30, 41, 59, 0.5);
      border: 1px dashed rgba(255, 255, 255, 0.2);
      border-radius: 14px;
      padding: 12px;
      text-align: center;
      margin: 4px 18px 12px;
      cursor: pointer;
      font-size: 13px;
      color: #94a3b8;
    }
    .add-station-banner:hover {
      border-color: #38bdf8;
      color: #38bdf8;
    }
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.7);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 100;
      padding: 20px;
    }
    .modal-card {
      background: #1e293b;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      width: 100%;
      max-width: 360px;
      padding: 20px;
    }
    .modal-card h3 {
      margin-bottom: 14px;
      font-size: 17px;
    }
    .modal-input {
      width: 100%;
      padding: 10px 12px;
      margin-bottom: 12px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: #0f172a;
      color: white;
      font-size: 13px;
    }
    .modal-buttons {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      margin-top: 10px;
    }
    .btn-action {
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 13px;
      border: none;
      cursor: pointer;
    }
    .btn-secondary {
      background: #334155;
      color: white;
    }
    .btn-primary {
      background: #0284c7;
      color: white;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo-box">
      <div class="logo-icon">📻</div>
      <div>
        <div class="logo-title">MyRadio Malaysia</div>
        <div class="tagline">Audio Streaming Peribadi</div>
      </div>
    </div>
    <div style="font-size: 12px; color: #38bdf8; font-weight: 600;" id="header-status">Siap</div>
  </header>

  <div class="search-box">
    <input type="text" id="searchInput" class="search-input" placeholder="🔍 Cari stesen radio...">
  </div>

  <div class="category-chips">
    <button class="chip active" onclick="filterCategory('semua')">Semua</button>
    <button class="chip" onclick="filterCategory('popular')">⭐ Popular</button>
    <button class="chip" onclick="filterCategory('berita')">📰 Berita & Bual</button>
    <button class="chip" onclick="filterCategory('islamik')">🕌 Islamik & Al-Quran</button>
    <button class="chip" onclick="filterCategory('muzik')">🎵 Muzik & Santai</button>
  </div>

  <div class="add-station-banner" onclick="openAddModal()">
    ➕ Tambah Stesen URL Sendiri
  </div>

  <div class="station-list" id="stationList">
    <!-- Diisi oleh Javascript -->
  </div>

  <!-- Player Bawah -->
  <div class="player-dock">
    <div class="player-progress-bar">
      <div class="player-progress-fill" id="playerProgress"></div>
    </div>
    <div class="player-inner">
      <div class="player-track">
        <div class="player-track-name" id="currentTitle">Pilih Stesen Radio</div>
        <div class="player-track-sub" id="currentSubtitle">
          <span class="live-dot" style="display:none;" id="liveIndicator"></span>
          <span id="statusText">Tekan stesen untuk main</span>
        </div>
      </div>
      <div class="controls">
        <button class="btn-control" onclick="playPrev()" title="Sebelumnya">⏮️</button>
        <button class="btn-control btn-play" id="btnPlayPause" onclick="togglePlay()">▶️</button>
        <button class="btn-control" onclick="playNext()" title="Seterusnya">⏭️</button>
      </div>
    </div>
  </div>

  <!-- Modal Tambah Stesen -->
  <div class="modal-overlay" id="addModal">
    <div class="modal-card">
      <h3>Tambah Stesen Baharu</h3>
      <input type="text" id="newStationName" class="modal-input" placeholder="Nama Stesen (cth: Era FM)">
      <input type="text" id="newStationCategory" class="modal-input" placeholder="Kategori (popular / muzik / islamik)">
      <input type="text" id="newStationUrl" class="modal-input" placeholder="URL Stream (mp3 / aac / m3u8)">
      <div class="modal-buttons">
        <button class="btn-action btn-secondary" onclick="closeAddModal()">Batal</button>
        <button class="btn-action btn-primary" onclick="saveNewStation()">Simpan</button>
      </div>
    </div>
  </div>

  <audio id="audioPlayer" preload="none"></audio>

  <script>
    // Senarai stesen siap sedia (Live verified streaming URLs)
    const DEFAULT_STATIONS = [
      {
        id: "hotfm",
        name: "Hot FM",
        genre: "Muzik Hangat & Hiburan",

      },
      {

      },
      {

      },
      {
        id: "kool101",

        genre: "Muzik & Info Terkini",
        category: "berita",
        icon: "🎙️",
        url: "https://stream.rcs.revma.com/3930238mtd3vv/hls.m3u8",
        type: "hls"
      },
      {
        id: "litefm",
        name: "Lite FM",
        genre: "Relaxing Favorites & Easy Listening",
        category: "muzik",
        icon: "☕",
        url: "https://stream.rcs.revma.com/bn4ex8sbv4uvv",
        type: "audio"
      },
      {
        id: "myfm",
        name: "MY FM",
        genre: "Muzik Pop & Hiburan Cina",
        category: "popular",
        icon: "🎧",
        url: "https://stream.rcs.revma.com/hc3unrtbv4uvv/hls.m3u8",
        type: "hls"
      },
      {
        id: "988fm",
        name: "988 FM",
        genre: "Berita & Muzik Cina Malaysia",
        category: "popular",
        icon: "📻",
        url: "https://28103.live.streamtheworld.com/988_FMAAC.aac",
        type: "audio"
      },
      {
        id: "radioklasik",
        name: "Radio Klasik RTM",
        genre: "Menggamit Kenangan Lagu Abadi",
        category: "muzik",
        icon: "📻",
        url: "https://playerservices.streamtheworld.com/api/livestream-redirect/RADIO_KLASIK.mp3",
        type: "audio"
      },
      {
        id: "nasionalfm",
        name: "Nasional FM RTM",
        genre: "Sentiasa di Hati & Berita Terkini",
        category: "berita",
        icon: "🇲🇾",
        url: "http://playerservices.streamtheworld.com/api/livestream-redirect/NASIONAL_FM.mp3",
        type: "audio"
      },
      {
        id: "bfm",
        name: "BFM 89.9",
        genre: "The Business Station (News & Talks)",
        category: "berita",
        icon: "💼",
        url: "https://22253.live.streamtheworld.com/BFM_SC",
        type: "audio"
      },
      {
        id: "ikimfm",
        name: "IKIM FM",
        genre: "Pilihan Utama Anda (Islamik)",
        category: "islamik",
        icon: "🕌",
        url: "https://stream.rcs.revma.com/kz3pdu9wz2nwv/hls.m3u8",
        type: "hls"
      },
      {
        id: "quranmakkah",
        name: "Radio Quran Makkah 24 Jam",
        genre: "Bacaan Ayat Suci Al-Quran Bersambung",
        category: "islamik",
        icon: "📖",
        url: "https://qurango.net/radio/salma",
        type: "audio"
      },
      {
        id: "slowrock",
        name: "Slow Rock 90's",
        genre: "Kompilasi Lagu Rock Klasik & Balada",
        category: "muzik",
        icon: "🎸",
        url: "https://stream.zeno.fm/hiut6cwfoneuv",
        type: "audio"
      },
      {
        id: "jazzlounge",
        name: "Jazz Lounge",
        genre: "Muzik Jazz Santai Coffee Shop",
        category: "muzik",
        icon: "🎷",
        url: "http://eu8.fastcast4u.com:5068/;",
        type: "audio"
      }
    ];

    let stations = JSON.parse(localStorage.getItem('myradio_custom_stations')) || DEFAULT_STATIONS;
    let currentIndex = -1;
    let isPlaying = false;
    let hls = null;
    let currentFilter = 'semua';

    const audio = document.getElementById('audioPlayer');
    const btnPlay = document.getElementById('btnPlayPause');
    const stationList = document.getElementById('stationList');
    const currentTitle = document.getElementById('currentTitle');
    const currentSubtitle = document.getElementById('currentSubtitle');
    const statusText = document.getElementById('statusText');
    const liveIndicator = document.getElementById('liveIndicator');
    const playerProgress = document.getElementById('playerProgress');
    const headerStatus = document.getElementById('headerStatus');

    function renderStations() {
      stationList.innerHTML = '';
      const query = document.getElementById('searchInput').value.toLowerCase().trim();

      const filtered = stations.filter(s => {
        const matchCategory = currentFilter === 'semua' || s.category === currentFilter;
        const matchSearch = s.name.toLowerCase().includes(query) || s.genre.toLowerCase().includes(query);
        return matchCategory && matchSearch;
      });

      if (filtered.length === 0) {
        stationList.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: #64748b; padding: 40px 0;">Tiada stesen dijumpai.</div>';
        return;
      }

      filtered.forEach((st) => {
        const actualIndex = stations.findIndex(item => item.id === st.id);
        const isCurrent = actualIndex === currentIndex;
        const card = document.createElement('div');
        card.className = `station-card ${isCurrent && isPlaying ? 'playing' : ''}`;
        card.onclick = () => selectStation(actualIndex);

        card.innerHTML = `
          <div class="station-icon">${st.icon || '📻'}</div>
          <div class="station-info">
            <div class="station-name">${st.name}</div>
            <div class="station-genre">${st.genre}</div>
          </div>
          <div class="badge-status">${isCurrent && isPlaying ? 'PLAYING' : 'READY'}</div>
        `;
        stationList.appendChild(card);
      });
    }

    function selectStation(index) {
      if (index < 0 || index >= stations.length) return;
      currentIndex = index;
      const st = stations[currentIndex];

      currentTitle.innerText = st.name;
      statusText.innerText = "Menyambung stream...";
      liveIndicator.style.display = "inline-block";
      playerProgress.classList.add('active');

      if (hls) {
        hls.destroy();
        hls = null;
      }

      // Check if HLS (.m3u8)
      if (st.url.includes('.m3u8') || st.type === 'hls') {
        if (Hls.isSupported()) {
          hls = new Hls({
            enableWorker: true,
            lowLatencyMode: true
          });
          hls.loadSource(st.url);
          hls.attachMedia(audio);
          hls.on(Hls.Events.MANIFEST_PARSED, () => {
            audio.play().catch(e => console.log('Autoplay dicegah:', e));
          });
          hls.on(Hls.Events.ERROR, (event, data) => {
            if (data.fatal) {
              statusText.innerText = "Gagal sambung stream.";
              playerProgress.classList.remove('active');
            }
          });
        } else if (audio.canPlayType('application/vnd.apple.mpegurl')) {
          // Native Safari / iOS HLS
          audio.src = st.url;
          audio.play().catch(e => console.log(e));
        }
      } else {
        // Standard Direct Stream (MP3 / AAC)
        audio.src = st.url;
        audio.play().catch(e => console.log(e));
      }

      updateMediaSession(st);
      renderStations();
    }

    function togglePlay() {
      if (currentIndex === -1) {
        if (stations.length > 0) selectStation(0);
        return;
      }
      if (audio.paused) {
        audio.play().catch(e => console.log(e));
      } else {
        audio.pause();
      }
    }

    function playNext() {
      if (stations.length === 0) return;
      let next = (currentIndex + 1) % stations.length;
      selectStation(next);
    }

    function playPrev() {
      if (stations.length === 0) return;
      let prev = (currentIndex - 1 + stations.length) % stations.length;
      selectStation(prev);
    }

    // Audio Event Handlers
    audio.addEventListener('playing', () => {
      isPlaying = true;
      btnPlay.innerText = '⏸️';
      statusText.innerText = "Sedang Dimainkan (Live)";
      playerProgress.classList.remove('active');
      renderStations();
    });

    audio.addEventListener('pause', () => {
      isPlaying = false;
      btnPlay.innerText = '▶️';
      statusText.innerText = "Dijeda (Paused)";
      playerProgress.classList.remove('active');
      renderStations();
    });

    audio.addEventListener('waiting', () => {
      statusText.innerText = "Buffering...";
      playerProgress.classList.add('active');
    });

    audio.addEventListener('error', () => {
      statusText.innerText = "Ralat memainkan audio.";
      playerProgress.classList.remove('active');
      isPlaying = false;
      btnPlay.innerText = '▶️';
    });

    // Android Lockscreen / Notification integration (Media Session API)
    function updateMediaSession(station) {
      if ('mediaSession' in navigator) {
        navigator.mediaSession.metadata = new MediaMetadata({
          title: station.name,
          artist: "MyRadio Malaysia",
          album: station.genre,
          artwork: [
            { src: 'https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=512&auto=format&fit=crop&q=80', sizes: '512x512', type: 'image/jpeg' }
          ]
        });

        navigator.mediaSession.setActionHandler('play', () => audio.play());
        navigator.mediaSession.setActionHandler('pause', () => audio.pause());
        navigator.mediaSession.setActionHandler('nexttrack', () => playNext());
        navigator.mediaSession.setActionHandler('previoustrack', () => playPrev());
      }
    }

    // Filter & Search
    function filterCategory(cat) {
      currentFilter = cat;
      document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
      event.target.classList.add('active');
      renderStations();
    }

    document.getElementById('searchInput').addEventListener('input', renderStations);

    // Modal Custom Station
    function openAddModal() {
      document.getElementById('addModal').style.display = 'flex';
    }
    function closeAddModal() {
      document.getElementById('addModal').style.display = 'none';
    }
    function saveNewStation() {
      const name = document.getElementById('newStationName').value.trim();
      const category = document.getElementById('newStationCategory').value.trim() || 'popular';
      const url = document.getElementById('newStationUrl').value.trim();

      if (!name || !url) {
        alert('Sila masukkan nama dan URL stesen.');
        return;
      }

      const newSt = {
        id: "custom_" + Date.now(),
        name: name,
        genre: "Stesen Tambahan Anda",
        category: category.toLowerCase(),
        icon: "📻",
        url: url,
        type: url.includes('.m3u8') ? 'hls' : 'audio'
      };

      stations.unshift(newSt);
      localStorage.setItem('myradio_custom_stations', JSON.stringify(stations));
      closeAddModal();
      renderStations();
      selectStation(0);
    }

    // Register PWA Service Worker
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js')
        .then(() => console.log('PWA Service Worker didaftarkan.'))
        .catch(err => console.log('SW Error:', err));
    }

    // First load
    renderStations();
  </script>
</body>
</html>
